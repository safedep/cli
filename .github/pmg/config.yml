# PMG settings for the CI jobs of this repository. ci.yml and goreleaser.yml
# pass this file to safedep/pmg as config-file. PMG reads the keys that this
# file does not set from its own template.
dependency_cooldown:
  enabled: true
  days: 2
  # SafeDep publishes these modules. The SDK bump takes the build that BSR
  # makes right after an API merge, and the cooldown would block that build.
  # PMG still runs malware analysis on them. control-tower and malysis skip
  # the same modules.
  skip:
    - purl: pkg:golang/buf.build/gen/go/safedep/api/connectrpc/go
      reason: "SafeDep API SDK, generated by BSR"
    - purl: pkg:golang/buf.build/gen/go/safedep/api/grpc/go
      reason: "SafeDep API SDK, generated by BSR"
    - purl: pkg:golang/buf.build/gen/go/safedep/api/protocolbuffers/go
      reason: "SafeDep API SDK, generated by BSR"
    - purl: pkg:golang/github.com/safedep/dry
      reason: "SafeDep shared library"
